name: Main

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: '0 15 * * 5'

jobs:
  matrix:
    outputs:
      json: ${{ steps.read-matrix.outputs.json }}
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: hanazuki/ruby-builder
      - id: read-matrix
        run: |
          echo "json=$(cat matrix.json)" >>"$GITHUB_OUTPUT"

  test:
    needs: matrix
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.matrix.outputs.json)}}
    runs-on: ${{ matrix.runner }}
    name: ruby-${{ matrix.ruby }} ${{ matrix.runner }} ${{ matrix.compilers.cxx }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Log in to ghcr.io
        run: |
          printenv GITHUB_TOKEN | oras login ghcr.io --username gh --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Ruby
        run: |
          pushd "$(mktemp -d)"
          oras manifest fetch-config "$TAG" | tee config.json

          PREFIX=$(jq -r '.install_prefix' <config.json)
          mkdir -p "$PREFIX"

          oras pull "$TAG"
          tar xf ruby.tar.zst -C "$PREFIX"
          popd

          echo "$PREFIX/bin" >>"$GITHUB_PATH"
        env:
          TAG: ${{ matrix.artifact_tag }}
      - name: Show environment
        run: |
          bundle env
      - name: Install gems
        run: |
          bundle install
      - name: Compile extensions
        run: |
          bundle exec rake compile
      - name: Run rspec
        run: |
          bundle exec rake spec

  build:
    needs: test
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ruby
      - uses: release-gems/action/build@4aaa7904a8e9de7f0f4a5b646e3cfe8f1e225c2b # v1.2.1
        with:
          sandbox: bubblewrap

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    environment: rubygems.org
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: release-gems/action/publish@4aaa7904a8e9de7f0f4a5b646e3cfe8f1e225c2b # v1.2.1
